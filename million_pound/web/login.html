<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 家庭宠物守护</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/login.js" defer></script></head>
<body class="login-body">

  </main>
