<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>分享视频 · Million Pound</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/share.js" type="module"></script>
</head>
<body class="login-body share-body">
  <main class="login-card share-card">
    <div class="brand-mark" aria-hidden="true">M</div>
    <p id="share-eyebrow" class="eyebrow">MILLION POUND · 分享片段</p>
    <h1 id="share-title">正在读取分享视频…</h1>
    <p id="share-period" class="muted"></p>
    <div class="detail-picture share-picture">
      <video id="share-video" controls muted loop autoplay playsinline preload="metadata" aria-label="分享的宠物录像，无声" hidden></video>
      <img id="share-image" alt="录像截图" hidden>
      <p id="share-missing" hidden>视频已过期、被删除或暂时不可用。</p>
    </div>
    <p id="share-status" class="notice" role="status" aria-live="polite" hidden></p>
    <p id="share-footnote" class="footnote">加速录像仅供参考</p>
  </main>
</body>
</html>
